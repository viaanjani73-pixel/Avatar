name: Build-APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Extract-Zip
        run: |
          sudo apt-get install -y unzip
          unzip AvatarDKunitydecode.zip -d project_temp

      # LANGKAH BARU: Memperbaiki layar dengan menghapus komponen GUI Layer yang rusak
      - name: Fix-Camera-Resolution
        run: |
          find project_temp -name "*.unity" -exec sed -i '/GUILayer:/d' {} +
          find project_temp -name "*.unity" -exec sed -i '/m_IsGuiLayer:/d' {} +

      - name: Build-Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          projectPath: project_temp/AvatarDKunitydecode/ExportedProject
          unityVersion: 2022.3.15f1
          allowDirtyBuild: true

      - name: Upload-APK
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Game-Avatar-Fixed
          path: build/Android
