name: Build-APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract-Zip
        run: |
          sudo apt-get install -y unzip
          unzip AvatarDKunitydecode.zip -d project_temp
          # Mencari di mana folder ProjectSettings berada dan menyimpannya ke variabel
          UNITY_PATH=$(find project_temp -name ProjectSettings -printf '%h')
          echo "PROJECT_PATH=$UNITY_PATH" >> $GITHUB_ENV
          echo "Folder ditemukan di: $UNITY_PATH"

      - name: Build-Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          # Menggunakan hasil pencarian otomatis tadi
          projectPath: ${{ env.PROJECT_PATH }}

      - name: Upload-APK
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Game-Avatar
          path: build/Android
