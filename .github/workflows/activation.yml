name: Build-APK-Final
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract-Zip
        run: |
          sudo apt-get install -y unzip
          unzip AvatarDKunitydecode.zip -d project_temp

      - name: Fix-Layar
        run: |
          PROJECT_ROOT="project_temp/AvatarDKunitydecode/ExportedProject"
          # Hapus komponen kamera lama agar layar otomatis penuh
          find "$PROJECT_ROOT" -name "*.unity" -exec sed -i '/GUILayer:/d' {} +
          find "$PROJECT_ROOT" -name "*.unity" -exec sed -i '/m_IsGuiLayer:/d' {} +
          # Paksa Android pakai resolusi Full Screen
          SETTINGS_FILE=$(find "$PROJECT_ROOT" -name "ProjectSettings.asset")
          sed -i 's/androidAspectRatio: .*/androidAspectRatio: 1/g' "$SETTINGS_FILE"

      - name: Build-Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: project_temp/AvatarDKunitydecode/ExportedProject
          unityVersion: 2022.3.15f1
          allowDirtyBuild: true

      - name: Upload-APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Fixed
          path: build/Android
