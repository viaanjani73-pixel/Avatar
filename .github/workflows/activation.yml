name: Build-APK-Final-Fix
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Extract-Zip
        run: |
          sudo apt-get install -y unzip
          unzip AvatarDKunitydecode.zip -d project_temp

      - name: Force-Clean-Project
        run: |
          # 1. Hapus komponen GUI Layer yang merusak tampilan kamera
          find project_temp -name "*.unity" -exec sed -i '/GUILayer:/d' {} +
          find project_temp -name "*.unity" -exec sed -i '/m_IsGuiLayer:/d' {} +
          
          # 2. Paksa Android menggunakan resolusi penuh (Native Aspect Ratio)
          SETTINGS_FILE=$(find project_temp -name "ProjectSettings.asset")
          sed -i 's/androidAspectRatio: .*/androidAspectRatio: 1/g' "$SETTINGS_FILE"
          sed -i 's/androidRenderOutsideSafeArea: .*/androidRenderOutsideSafeArea: 1/g' "$SETTINGS_FILE"
          sed -i 's/androidUseCustomAspectRatio: .*/androidUseCustomAspectRatio: 0/g' "$SETTINGS_FILE"

      - name: Build-Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          # Pastikan UNITY_EMAIL dan PASSWORD tetap ada tapi SERIAL sudah dihapus di Secrets
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: project_temp/AvatarDKunitydecode/ExportedProject
          unityVersion: 2022.3.15f1
          allowDirtyBuild: true

      - name: Upload-APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Avatar-Final
          path: build/Android
