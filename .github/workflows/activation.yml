name: Build-APK-Super-Fix
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract-Zip
        run: |
          sudo apt-get install -y unzip
          unzip AvatarDKunitydecode.zip -d project_temp

      - name: Fix-Layar-dan-UI
        run: |
          PROJECT_ROOT="project_temp/AvatarDKunitydecode/ExportedProject"
          
          # 1. Hapus paksa komponen GUILayer yang merusak rasio layar
          find "$PROJECT_ROOT" -name "*.unity" -exec sed -i '/GUILayer:/d' {} +
          find "$PROJECT_ROOT" -name "*.unity" -exec sed -i '/m_IsGuiLayer:/d' {} +
          
          # 2. Paksa Android menggunakan resolusi penuh (Layar Penuh)
          SETTINGS_FILE=$(find "$PROJECT_ROOT" -name "ProjectSettings.asset")
          sed -i 's/androidAspectRatio: .*/androidAspectRatio: 1/g' "$SETTINGS_FILE"
          sed -i 's/androidRenderOutsideSafeArea: .*/androidRenderOutsideSafeArea: 1/g' "$SETTINGS_FILE"
          
          # 3. Hapus folder sisa build lama (Force Clean)
          rm -rf "$PROJECT_ROOT/Library"
          rm -rf "$PROJECT_ROOT/Temp"

      - name: Build-Project
        uses: game-ci/unity-builder@v4
        env:
          # PAKSA OFFLINE: Jangan gunakan Email/Password agar tidak dicek status Pro Online-nya
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          projectPath: project_temp/AvatarDKunitydecode/ExportedProject
          unityVersion: 2022.3.15f1
          allowDirtyBuild: true

      - name: Upload-APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Avatar-Final-NoTrial
          path: build/Android
